# Example secretscan config. Copy to .secretscan.toml in a repo root
# (auto-discovered), or pass with -c / $SECRETSCAN_CONFIG.
#
# The schema is a superset of gitleaks v8, so an existing .gitleaks.toml
# also works. Custom rules are ADDED to the built-in pack; a rule with the
# same id as a built-in replaces it.

title = "example org secretscan config"

[remediation]
# store   = "azure"     # env | vault | aws | azure | gcp: target of fix guidance and snippets
# runbook = "https://wiki.example.com/platform/secrets-rotation"

[extend]
# useDefault = false            # uncomment to use ONLY the rules below
# path = "../shared/org.toml"   # inherit another config (org baseline)
disabledRules = [
  # "jwt",                      # turn off noisy built-ins by id
]

# ---------------------------------------------------------------------------
# Custom rules
#
# Fields: id, description, regex (Go RE2), secretGroup, entropy, keywords,
# path, tags, severity (critical|high|medium|low|info), allowlist(s),
# examples / negatives (self-tests run by `secretscan validate`).

[[rules]]
id = "acme-service-token"
description = "ACME internal service token"
regex = '''\b(acme_(?:live|test)_[A-Za-z0-9]{32})\b'''
secretGroup = 1
keywords = ["acme_live_", "acme_test_"]   # fast prefilter; strongly recommended
severity = "critical"
tags = ["internal"]
examples = ["ACME_TOKEN=acme_live_abcdefghijklmnopqrstuvwxyz012345"]
negatives = ["acme_live_short"]

  [rules.allowlist]
  description = "documented sample token"
  regexes = ['''acme_test_0{32}''']

[[rules]]
id = "acme-db-password"
description = "Password key in ACME service config files"
# Semi-generic: identifier, operator, then the secret in group 1.
regex = '''(?i)acme[_.-]?db[_.-]?pass(?:word)?\s*[:=]\s*["']?([^\s"']{8,})'''
secretGroup = 1
entropy = 3.0
keywords = ["acme"]
path = '''(?i)\.(?:ya?ml|properties|conf|ini|env)$'''   # only these files
severity = "high"
examples = ["acme.db.password: Zx81vQ!pLm2"]

[[rules]]
id = "acme-signing-material"
description = "Files that must never be committed"
path = '''(?i)(?:^|/)(?:signing|release)[-_]key\.(?:p12|jks|pem)$'''   # path-only rule
severity = "critical"

# ---------------------------------------------------------------------------
# Global allowlists. Within one allowlist, criteria are OR'ed unless
# condition = "AND". regexTarget = secret (default) | match | line |
# prefix (the identifier and operator before the secret).

[[allowlists]]
description = "test fixtures"
paths = ['''(?:^|/)(?:testdata|fixtures)/''']

[[allowlists]]
description = "only silence the generic rule in docs"
targetRules = ["generic-api-key", "password-assignment"]
paths = ['''(?i)\.(?:md|rst|adoc)$''']

[[allowlists]]
description = "known rotated credential left in history"
condition = "AND"
commits = ["0123456789abcdef0123456789abcdef01234567"]
paths = ['''^legacy/settings\.py$''']
