name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # keyless signing (Sigstore) and provenance
      attestations: write # GitHub build-provenance attestations
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -count=1 ./...
      - run: make release VERSION=${GITHUB_REF_NAME}
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      # Publisher authentication, not just consistency: SHA256SUMS is signed
      # with a short-lived Sigstore certificate bound to this workflow, and
      # every binary gets a build-provenance attestation.
      - uses: sigstore/cosign-installer@v3
      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/secretscan-*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          # Release notes are the CHANGELOG section for this version.
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --title "secretscan $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  # Install the published release the way the README says, on clean runners,
  # and check that it actually blocks a secret.
  verify-install:
    needs: release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: install.sh (checksum and signature verified)
        run: |
          BINDIR="$RUNNER_TEMP/bin" SECRETSCAN_REQUIRE_SIGNATURE=1 sh install.sh "$GITHUB_REF_NAME"
          "$RUNNER_TEMP/bin/secretscan" version | grep -qx "secretscan $GITHUB_REF_NAME"
      - name: The installed binary blocks a secret and passes clean code
        run: |
          d="$RUNNER_TEMP/smoke" && mkdir -p "$d" && cd "$d" && git init -q
          echo 'print("hello")' > ok.py
          "$RUNNER_TEMP/bin/secretscan" dir . -q
          tok="ghp_$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 36)"
          echo "TOKEN = \"$tok\"" > leak.py
          if "$RUNNER_TEMP/bin/secretscan" dir . -q; then echo "secret not blocked"; exit 1; fi
      - name: Build provenance verifies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          os=$(uname -s | tr A-Z a-z); arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          gh release download "$GITHUB_REF_NAME" -p "secretscan-$os-$arch" -D "$RUNNER_TEMP/att"
          gh attestation verify "$RUNNER_TEMP/att/secretscan-$os-$arch" --repo "$GITHUB_REPOSITORY"
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: go install at the tag
        run: |
          GOBIN="$RUNNER_TEMP/gobin" go install "github.com/${GITHUB_REPOSITORY}/cmd/secretscan@${GITHUB_REF_NAME}"
          "$RUNNER_TEMP/gobin/secretscan" version | grep -qx "secretscan $GITHUB_REF_NAME"
      - name: pre-commit hook resolves to the tag
        run: |
          pipx install pre-commit || python3 -m pip install --user pre-commit
          d="$RUNNER_TEMP/pc" && mkdir -p "$d" && cd "$d" && git init -q
          git config user.email ci@example.com && git config user.name ci
          printf 'repos:\n  - repo: https://github.com/%s\n    rev: %s\n    hooks:\n      - id: secretscan\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > .pre-commit-config.yaml
          git add .pre-commit-config.yaml && git commit -qm init
          tok="ghp_$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 36)"
          echo "TOKEN = \"$tok\"" > leak.py && git add leak.py
          if pre-commit run secretscan; then echo "hook did not block"; exit 1; fi

  # The same checks on Windows, through install.ps1.
  verify-install-windows:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: install.ps1 (checksum and signature verified)
        run: |
          ./install.ps1 -Version $env:GITHUB_REF_NAME -InstallDir "$env:RUNNER_TEMP\bin" -RequireSignature
          $v = & "$env:RUNNER_TEMP\bin\secretscan.exe" version
          if ($v -ne "secretscan $env:GITHUB_REF_NAME") { throw "unexpected version: $v" }
      - name: Build provenance verifies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:GITHUB_REF_NAME -p secretscan-windows-amd64.exe -D "$env:RUNNER_TEMP\att"
          gh attestation verify "$env:RUNNER_TEMP\att\secretscan-windows-amd64.exe" --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "provenance verification failed" }
      - name: The installed binary blocks a secret and passes clean code
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'smoke'; New-Item -ItemType Directory $d | Out-Null; Set-Location $d
          git init -q
          'print("hello")' | Set-Content ok.py
          & "$env:RUNNER_TEMP\bin\secretscan.exe" dir . -q
          if ($LASTEXITCODE -ne 0) { throw "clean code was blocked" }
          $chars = [char[]]'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'
          $tok = 'ghp_' + -join (1..36 | ForEach-Object { $chars | Get-Random })
          "TOKEN = `"$tok`"" | Set-Content leak.py
          & "$env:RUNNER_TEMP\bin\secretscan.exe" dir . -q
          if ($LASTEXITCODE -ne 1) { throw "secret not blocked (exit $LASTEXITCODE)" }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: go install at the tag
        run: |
          $env:GOBIN = "$env:RUNNER_TEMP\gobin"
          go install "github.com/$env:GITHUB_REPOSITORY/cmd/secretscan@$env:GITHUB_REF_NAME"
          $v = & "$env:GOBIN\secretscan.exe" version
          if ($v -ne "secretscan $env:GITHUB_REF_NAME") { throw "unexpected version: $v" }
