name: Bug report
description: Crash, wrong output, hook or CLI problem
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened and what you expected }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Command and minimal reproduction, render: shell }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: secretscan version and OS }
