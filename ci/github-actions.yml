# GitHub Actions: scan pushed/PR commits and upload SARIF to code scanning.
name: secretscan
on: [push, pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: go install github.com/AISolutionLabs/secret-scanner/cmd/secretscan@latest
      - name: Scan
        env:
          # Keyed (hmac-sha256:) fingerprints in the uploaded SARIF, so people
          # who can read code-scanning alerts cannot test guesses of weak
          # passwords against them. Create the secret with a random value
          # (openssl rand -hex 32); without it, fingerprints are plain SHA-256.
          SECRETSCAN_HASH_KEY: ${{ secrets.SECRETSCAN_HASH_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
            git cat-file -e "${{ github.event.before }}" 2>/dev/null || RANGE="--all"
          fi
          secretscan git --log-opts "$RANGE" -r secretscan.sarif --no-color
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: secretscan.sarif }
