name: Missed secret (false negative)
description: A credential format secretscan should detect but doesn't
labels: [false-negative]
body:
  - type: markdown
    attributes:
      value: "**Never paste a real secret.** Use a revoked token or describe the format (prefix, length, alphabet) with a synthetic example."
  - type: input
    id: provider
    attributes: { label: Provider / credential type, placeholder: e.g. Acme Cloud API token }
    validations: { required: true }
  - type: textarea
    id: format
    attributes: { label: Format and synthetic example, description: "Link to the provider's docs if the format is documented." }
    validations: { required: true }
  - type: textarea
    id: context
    attributes: { label: Where it appeared (file type, surrounding line shape) }
