# secretscan's own settings for scanning this repository (CI self-scan).
#
# The detector tests are tables of fixture values: realistic-looking strings
# that must, or must not, be reported. Real-format secrets in tests are
# generated at runtime, so nothing here is a credential. This allowlist is
# scoped to Go test files in this repository only.
[[allowlists]]
description = "detector test fixture tables"
paths = ['''^(?:internal|cmd)/[\w/]+_test\.go$''']
