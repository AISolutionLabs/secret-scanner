name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # keyless signing (Sigstore) and provenance
      attestations: write # GitHub build-provenance attestations
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -count=1 ./...
      # The published figures must describe this release's detection code.
      - name: Benchmark figures measured on this detection code
        run: python3 bench/render_docs.py --check --release
      - run: make release VERSION=${GITHUB_REF_NAME}
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      # Publisher authentication, not just consistency: SHA256SUMS is signed
      # with a short-lived Sigstore certificate bound to this workflow, and
      # every binary gets a build-provenance attestation.
      - uses: sigstore/cosign-installer@v3
      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/secretscan-*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          # Release notes: docs/release-notes/<tag>.md when present (figures
          # generated from bench/results/latest.json, checked in CI), else the
          # CHANGELOG section for this version. The CHANGELOG section must
          # exist either way.
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          if [ -f "docs/release-notes/$GITHUB_REF_NAME.md" ]; then
            grep -v '^<!-- /\{0,1\}bench:' "docs/release-notes/$GITHUB_REF_NAME.md" > notes.md
          fi
          # A release created by hand on GitHub (which also creates the tag)
          # must still get its binaries: upload into it instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::warning::release $GITHUB_REF_NAME already existed (created by hand?); uploading assets and setting notes"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "secretscan $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "secretscan $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi

  # Install the published release the way the README says, on clean runners
  # (Linux, macOS, Windows), and check that it actually blocks a secret.
  verify:
    needs: release
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ github.ref_name }}
