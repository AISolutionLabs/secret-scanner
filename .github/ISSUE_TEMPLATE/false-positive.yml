name: False positive
description: secretscan reported something that is not a secret
labels: [false-positive]
body:
  - type: markdown
    attributes:
      value: "**Never paste a real secret.** Replace characters with random ones of the same kind (letters, digits, symbols) so the shape is preserved."
  - type: input
    id: rule
    attributes: { label: Rule ID, placeholder: generic-api-key }
    validations: { required: true }
  - type: textarea
    id: sample
    attributes: { label: Sanitized line (and file type), render: text }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why it is not a secret }
  - type: input
    id: version
    attributes: { label: secretscan version, placeholder: output of `secretscan version` }
