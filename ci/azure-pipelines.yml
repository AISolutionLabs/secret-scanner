# Azure DevOps: scan the PR's new commits (or the full history on main) and
# publish SARIF for the "Scans" tab (SARIF SAST Scans Tab extension).
trigger: [main]
pr: [main]

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0

  - task: GoTool@0
    inputs: { version: '1.24' }

  - script: go install github.com/AISolutionLabs/secret-scanner/cmd/secretscan@latest
    displayName: Install secretscan

  - script: |
      set -e
      case "$SECRETSCAN_HASH_KEY" in '$('*)
        echo "##vso[task.logissue type=warning]SECRETSCAN_HASH_KEY is not defined: SARIF fingerprints are plain SHA-256"
        unset SECRETSCAN_HASH_KEY ;;
      esac
      if [ -n "$(System.PullRequest.TargetBranch)" ]; then
        TARGET="origin/${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
        RANGE="$TARGET..HEAD"
      else
        RANGE="--all"
      fi
      "$(go env GOPATH)/bin/secretscan" git --log-opts "$RANGE" \
        -r "$(Build.ArtifactStagingDirectory)/CodeAnalysisLogs/secretscan.sarif" --no-color
    displayName: Secret scan
    env:
      # Keyed (hmac-sha256:) fingerprints in the published SARIF artifact, so
      # its readers cannot test guesses of weak passwords. Define a secret
      # pipeline variable SECRETSCAN_HASH_KEY (openssl rand -hex 32). If it is
      # undefined, Azure passes the literal "$(...)" text; the script above
      # drops it with a warning (secretscan itself refuses such a "key").
      SECRETSCAN_HASH_KEY: $(SECRETSCAN_HASH_KEY)

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs
      ArtifactName: CodeAnalysisLogs
